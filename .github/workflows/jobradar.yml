name: JobRadar - Varredura Automatizada de Vagas

on:
  schedule:
    # Roda a cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar-busca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar ambiente Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar Varredura de Vagas e Disparo de E-mail Consolidado
        run: |
          python main.py --perfil brasil --once

      - name: Salvar histórico de vagas no repositório
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db data/jobs.json data/user_config.json 2>/dev/null || true
          git commit -m "chore: atualizar historico de vagas e metadados [skip ci]" || true
          git pull --rebase origin main || true
          git push origin main || true
