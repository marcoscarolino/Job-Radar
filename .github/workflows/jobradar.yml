name: JobRadar - Varredura Automatizada de Vagas

on:
  schedule:
    # Roda a cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  executar-busca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar Varredura de Vagas e Disparo de E-mail Consolidado
        run: |
          python main.py --perfil brasil --once

      - name: Sincronizar data/jobs.json e configuracoes no repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/jobs.json data/user_config.json || true
          git diff --staged --quiet || (git commit -m "auto: atualizacao automatica de vagas via GitHub Actions" && git push origin main)
