name: Testes

# Roda em todo push, não só no cron de scraping (jobradar.yml) — regressão
# na camada de filtro precisa aparecer na hora do commit, não só ser
# descoberta olhando o log de produção 3h depois.
on:
  push:
  workflow_dispatch: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sem "playwright install" de propósito: os testes da camada de
      # filtro (tests/test_filtro.py) não abrem browser nenhum — só
      # testam função pura (extrair_escopo_remoto, Job.combina_com).
      # Importar os módulos dos scrapers funciona sem o binário do
      # navegador (só falha se tentar de fato LANÇAR um browser), então
      # o passo de download fica reservado só pro workflow de scraping.
      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest tests/ -v
